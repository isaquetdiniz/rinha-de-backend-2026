services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "30MB"

  api1:
    image: ghcr.io/isaquetdiniz/rinha-de-backend-2026:4d4c273
    environment:
      DATA_DIR: /data
    volumes:
      - ./mcc_risk.json:/data/mcc_risk.json:ro
      - ./normalization.json:/data/normalization.json:ro
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

  api2:
    image: ghcr.io/isaquetdiniz/rinha-de-backend-2026:4d4c273
    environment:
      DATA_DIR: /data
    volumes:
      - ./mcc_risk.json:/data/mcc_risk.json:ro
      - ./normalization.json:/data/normalization.json:ro
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

networks:
  backend:
    driver: bridge
