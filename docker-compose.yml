services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - sockets:/sockets
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "10MB"

  api1:
    image: ghcr.io/isaquetdiniz/rinha-de-backend-2026:f6249d5
    platform: linux/amd64
    environment:
      SOCKET_PATH: /sockets/api1.sock
      USE_KNN: "true"
      KNN_NPROBE: "64"
      KNN_NPROBE_FAST: "2"
      KNN_K: "5"
      KNN_THRESHOLD: "0.6"
      DATA_DIR: /data
    volumes:
      - sockets:/sockets
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "170MB"

  api2:
    image: ghcr.io/isaquetdiniz/rinha-de-backend-2026:f6249d5
    platform: linux/amd64
    environment:
      SOCKET_PATH: /sockets/api2.sock
      USE_KNN: "true"
      KNN_NPROBE: "64"
      KNN_NPROBE_FAST: "2"
      KNN_K: "5"
      KNN_THRESHOLD: "0.6"
      DATA_DIR: /data
    volumes:
      - sockets:/sockets
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "170MB"

volumes:
  sockets:

networks:
  backend:
    driver: bridge
