services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "30MB"

  api1:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATA_DIR: /data
    volumes:
      - ./qdrant/mcc_risk.json:/data/mcc_risk.json:ro
      - ./qdrant/normalization.json:/data/normalization.json:ro
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

  api2:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATA_DIR: /data
    volumes:
      - ./qdrant/mcc_risk.json:/data/mcc_risk.json:ro
      - ./qdrant/normalization.json:/data/normalization.json:ro
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

networks:
  backend:
    driver: bridge
