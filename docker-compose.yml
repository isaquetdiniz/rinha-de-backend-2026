services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "10MB"

  api1:
    image: ghcr.io/isaquetdiniz/rinha-de-backend-2026:c5ee2c2
    platform: linux/amd64
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "170MB"

  api2:
    image: ghcr.io/isaquetdiniz/rinha-de-backend-2026:c5ee2c2
    platform: linux/amd64
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "170MB"

networks:
  backend:
    driver: bridge
