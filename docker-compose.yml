volumes:
  sockets:

services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - sockets:/sockets
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "30MB"

  api1:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      SOCKET_PATH: /sockets/api1.sock
      USE_KNN: "true"
      KNN_NPROBE: "64"
      KNN_K: "5"
      KNN_THRESHOLD: "0.6"
      DATA_DIR: /data
    volumes:
      - sockets:/sockets
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

  api2:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      SOCKET_PATH: /sockets/api2.sock
      USE_KNN: "true"
      KNN_NPROBE: "64"
      KNN_K: "5"
      KNN_THRESHOLD: "0.6"
      DATA_DIR: /data
    volumes:
      - sockets:/sockets
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

networks:
  backend:
    driver: bridge
